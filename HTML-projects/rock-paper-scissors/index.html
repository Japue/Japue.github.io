<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock - Paper - Scissors</h1>
    
    <div class="buttonWrapper">
        <button id="rock-button" class="buttons">🪨</button>
        <button id="paper-button" class="buttons">🧻</button>
        <button id="scissors-button" class="buttons">✂️</button>
    </div>

    <div class="moves">
        <p id="player-move">Player: </p>
        <p id="computer-move">Computer: </p>
    </div>

    <p id="result"></p>

    <div class="scores">
        <p id="player-score">Player score: </p>
        <p id="computer-score">Computer score: </p>
    </div>
    <script src="index.js"></script>
</body>
</html>
